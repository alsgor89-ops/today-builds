<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Memory Match</title>
<style>
  :root {
    --bg: #fdf6ec;
    --panel: #ffffff;
    --ink: #2b2a28;
    --sub: #8a8377;
    --accent: #ff8552;
    --line: #eee2d0;
    --card-back: #ff8552;
    --card-back2: #ffb088;
    --matched: #7bc99a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1a17;
      --panel: #262320;
      --ink: #f3ede4;
      --sub: #a89e8f;
      --accent: #ff9a6b;
      --line: #3a352e;
      --card-back: #a4562f;
      --card-back2: #7a3d1f;
      --matched: #4f9a71;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .app { width: 100%; max-width: 480px; }
  h1 { font-size: 20px; font-weight: 700; margin: 0 0 4px; text-align: center; }
  .tagline { text-align: center; color: var(--sub); font-size: 13px; margin-bottom: 20px; }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    gap: 10px;
    flex-wrap: wrap;
  }
  .stats {
    display: flex;
    gap: 14px;
    font-size: 13px;
    color: var(--sub);
  }
  .stats b { color: var(--ink); }
  .diff-switch {
    display: inline-flex;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
  }
  .diff-switch button {
    border: none;
    background: transparent;
    color: var(--sub);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  .diff-switch button.active { background: var(--accent); color: white; }
  button.restart {
    border: none;
    background: var(--ink);
    color: var(--bg);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  .board {
    display: grid;
    gap: 8px;
  }
  .card {
    aspect-ratio: 1;
    border-radius: 12px;
    cursor: pointer;
    position: relative;
    perspective: 600px;
  }
  .card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.35s;
  }
  .card.flipped .card-inner,
  .card.matched .card-inner {
    transform: rotateY(180deg);
  }
  .face {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    backface-visibility: hidden;
  }
  .face.front {
    background: linear-gradient(135deg, var(--card-back), var(--card-back2));
  }
  .face.back {
    background: var(--panel);
    border: 2px solid var(--line);
    transform: rotateY(180deg);
    font-size: 28px;
  }
  .card.matched .face.back {
    border-color: var(--matched);
    background: color-mix(in srgb, var(--matched) 18%, var(--panel));
  }

  .win-banner {
    text-align: center;
    margin-top: 18px;
    padding: 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
  }
  .win-banner .big { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .win-banner .sub { color: var(--sub); font-size: 13px; margin-bottom: 12px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <h1>Memory Match</h1>
  <div class="tagline">카드를 뒤집어 짝을 맞춰보세요</div>

  <div class="toolbar">
    <div class="stats">
      <div>이동 <b id="moves">0</b></div>
      <div>시간 <b id="timer">0:00</b></div>
      <div>최고 <b id="best">-</b></div>
    </div>
    <div style="display:flex; gap:8px; align-items:center;">
      <div class="diff-switch">
        <button data-size="4" class="active">4×4</button>
        <button data-size="6">6×6</button>
      </div>
      <button class="restart" id="restartBtn">다시하기</button>
    </div>
  </div>

  <div class="board" id="board"></div>

  <div class="win-banner" id="winBanner" hidden>
    <div class="big">🎉 클리어!</div>
    <div class="sub" id="winSub"></div>
  </div>
</div>

<script>
(function () {
  const EMOJIS = ['🐱','🐶','🦊','🐼','🐸','🐵','🦁','🐷','🐰','🐨','🐯','🐮','🐔','🦄','🐙','🦋','🐢','🦉'];
  let size = 4;
  let cards = [];
  let flipped = [];
  let matchedCount = 0;
  let moves = 0;
  let timerSec = 0;
  let timerId = null;
  let started = false;
  let locked = false;

  const boardEl = document.getElementById('board');
  const movesEl = document.getElementById('moves');
  const timerEl = document.getElementById('timer');
  const bestEl = document.getElementById('best');
  const winBanner = document.getElementById('winBanner');
  const winSub = document.getElementById('winSub');

  function bestKey() { return `memorymatch.best.${size}x${size}`; }

  function loadBest() {
    try {
      const raw = localStorage.getItem(bestKey());
      if (!raw) { bestEl.textContent = '-'; return; }
      const { moves, time } = JSON.parse(raw);
      bestEl.textContent = `${moves}수 / ${fmt(time)}`;
    } catch (e) { bestEl.textContent = '-'; }
  }

  function saveBestIfBetter() {
    try {
      const raw = localStorage.getItem(bestKey());
      const current = { moves, time: timerSec };
      if (!raw) {
        localStorage.setItem(bestKey(), JSON.stringify(current));
        return true;
      }
      const prev = JSON.parse(raw);
      if (current.moves < prev.moves || (current.moves === prev.moves && current.time < prev.time)) {
        localStorage.setItem(bestKey(), JSON.stringify(current));
        return true;
      }
      return false;
    } catch (e) { return false; }
  }

  function fmt(s) {
    const m = Math.floor(s / 60);
    const ss = (s % 60).toString().padStart(2, '0');
    return `${m}:${ss}`;
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function buildDeck() {
    const pairCount = (size * size) / 2;
    const pool = shuffle([...EMOJIS]).slice(0, pairCount);
    const deck = shuffle([...pool, ...pool]).map((emoji, i) => ({
      id: i,
      emoji,
      matched: false,
    }));
    return deck;
  }

  function startTimer() {
    stopTimer();
    timerSec = 0;
    timerEl.textContent = fmt(0);
    timerId = setInterval(() => {
      timerSec++;
      timerEl.textContent = fmt(timerSec);
    }, 1000);
  }
  function stopTimer() {
    if (timerId) clearInterval(timerId);
    timerId = null;
  }

  function render() {
    boardEl.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
    boardEl.innerHTML = '';
    cards.forEach((card, idx) => {
      const el = document.createElement('div');
      el.className = 'card' + (card.matched ? ' matched' : '');
      el.innerHTML = `
        <div class="card-inner">
          <div class="face front"></div>
          <div class="face back">${card.emoji}</div>
        </div>
      `;
      el.addEventListener('click', () => onCardClick(idx, el));
      boardEl.appendChild(el);
    });
  }

  function onCardClick(idx, el) {
    if (locked) return;
    const card = cards[idx];
    if (card.matched || flipped.some((f) => f.idx === idx)) return;

    if (!started) {
      started = true;
      startTimer();
    }

    el.classList.add('flipped');
    flipped.push({ idx, el });

    if (flipped.length === 2) {
      moves++;
      movesEl.textContent = moves;
      locked = true;
      const [a, b] = flipped;
      if (cards[a.idx].emoji === cards[b.idx].emoji) {
        cards[a.idx].matched = true;
        cards[b.idx].matched = true;
        a.el.classList.add('matched');
        b.el.classList.add('matched');
        matchedCount += 2;
        flipped = [];
        locked = false;
        if (matchedCount === cards.length) {
          onWin();
        }
      } else {
        setTimeout(() => {
          a.el.classList.remove('flipped');
          b.el.classList.remove('flipped');
          flipped = [];
          locked = false;
        }, 700);
      }
    }
  }

  function onWin() {
    stopTimer();
    const isBest = saveBestIfBetter();
    loadBest();
    winSub.textContent = `${moves}수 · ${fmt(timerSec)}` + (isBest ? ' — 신기록!' : '');
    winBanner.hidden = false;
  }

  function newGame() {
    stopTimer();
    started = false;
    locked = false;
    moves = 0;
    matchedCount = 0;
    timerSec = 0;
    movesEl.textContent = '0';
    timerEl.textContent = fmt(0);
    winBanner.hidden = true;
    cards = buildDeck();
    loadBest();
    render();
  }

  document.querySelectorAll('.diff-switch button').forEach((btn) => {
    btn.addEventListener('click', () => {
      size = parseInt(btn.dataset.size, 10);
      document.querySelectorAll('.diff-switch button').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      newGame();
    });
  });

  document.getElementById('restartBtn').addEventListener('click', newGame);

  newGame();
})();
</script>
</body>
</html>
