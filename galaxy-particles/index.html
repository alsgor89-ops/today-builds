<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Galaxy Particles</title>
<style>
  :root {
    --bg: #05060f;
    --panel: rgba(20, 22, 40, 0.85);
    --ink: #eef0ff;
    --sub: #9aa0c7;
    --line: #2a2d4d;
    --accent: #8b7bff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, sans-serif;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
  }
  .topbar {
    position: absolute;
    top: 16px; left: 18px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--sub);
    pointer-events: none;
  }
  .panel {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel);
    backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 90vw;
  }
  .control {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 11px;
    color: var(--sub);
  }
  .control input[type="range"] { width: 110px; }
  .swatches { display: flex; gap: 6px; }
  .swatch {
    width: 20px; height: 20px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .swatch.selected { border-color: white; transform: scale(1.15); }
  .mode-toggle {
    display: flex;
    background: rgba(255,255,255,0.06);
    border-radius: 999px;
    padding: 3px;
  }
  .mode-toggle button {
    border: none;
    background: transparent;
    color: var(--sub);
    font-size: 11px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  .mode-toggle button.active { background: var(--accent); color: white; }
  button.reset {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }
  .hint {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: var(--sub);
    font-size: 13px;
    text-align: center;
    pointer-events: none;
    opacity: 0.8;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="topbar">✨ GALAXY PARTICLES</div>
<div class="hint" id="hint">마우스를 움직여 입자를 끌어당기거나 밀어내세요<br/>클릭하면 폭발합니다</div>

<div class="panel">
  <div class="control">
    개수
    <input type="range" id="countSlider" min="80" max="800" value="300" />
  </div>
  <div class="mode-toggle">
    <button data-mode="attract" class="active">끌어당기기</button>
    <button data-mode="repel">밀어내기</button>
  </div>
  <div class="swatches" id="swatches"></div>
  <button class="reset" id="resetBtn">리셋</button>
</div>

<script>
(function () {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const THEMES = [
    ['#8b7bff', '#5ee6c8', '#ff7ab8'],
    ['#ff9d5c', '#ffd15c', '#ff5c8a'],
    ['#5cc9ff', '#5cffb0', '#c95cff'],
    ['#ffffff', '#b8bcff', '#7c82ff'],
  ];
  let themeIndex = 0;

  const swatchesEl = document.getElementById('swatches');
  THEMES.forEach((theme, i) => {
    const s = document.createElement('div');
    s.className = 'swatch' + (i === 0 ? ' selected' : '');
    s.style.background = `linear-gradient(135deg, ${theme[0]}, ${theme[2]})`;
    s.addEventListener('click', () => {
      themeIndex = i;
      document.querySelectorAll('.swatch').forEach((el) => el.classList.remove('selected'));
      s.classList.add('selected');
    });
    swatchesEl.appendChild(s);
  });

  let mode = 'attract';
  document.querySelectorAll('.mode-toggle button').forEach((btn) => {
    btn.addEventListener('click', () => {
      mode = btn.dataset.mode;
      document.querySelectorAll('.mode-toggle button').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  let particles = [];
  let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2, active: false };

  function rand(min, max) { return min + Math.random() * (max - min); }

  function makeParticle() {
    const theme = THEMES[themeIndex];
    return {
      x: rand(0, window.innerWidth),
      y: rand(0, window.innerHeight),
      vx: rand(-0.3, 0.3),
      vy: rand(-0.3, 0.3),
      r: rand(1, 2.6),
      color: theme[Math.floor(Math.random() * theme.length)],
    };
  }

  function setCount(n) {
    if (particles.length < n) {
      while (particles.length < n) particles.push(makeParticle());
    } else {
      particles.length = n;
    }
  }

  setCount(300);

  const countSlider = document.getElementById('countSlider');
  countSlider.addEventListener('input', () => setCount(parseInt(countSlider.value, 10)));

  document.getElementById('resetBtn').addEventListener('click', () => {
    particles = [];
    setCount(parseInt(countSlider.value, 10));
  });

  canvas.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
    hint.style.display = 'none';
  });
  canvas.addEventListener('mouseleave', () => { mouse.active = false; });
  canvas.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    if (t) { mouse.x = t.clientX; mouse.y = t.clientY; mouse.active = true; hint.style.display = 'none'; }
  }, { passive: true });

  let bursts = [];
  canvas.addEventListener('click', (e) => {
    bursts.push({ x: e.clientX, y: e.clientY, life: 1 });
  });

  function update() {
    const theme = THEMES[themeIndex];
    particles.forEach((p) => {
      if (mouse.active) {
        const dx = mouse.x - p.x;
        const dy = mouse.y - p.y;
        const distSq = dx * dx + dy * dy + 400;
        const force = (mode === 'attract' ? 1 : -1) * 120 / distSq;
        p.vx += dx * force * 0.02;
        p.vy += dy * force * 0.02;
      }
      bursts.forEach((b) => {
        const dx = p.x - b.x;
        const dy = p.y - b.y;
        const dist = Math.sqrt(dx * dx + dy * dy) + 0.01;
        const force = (1 - b.life) * 6 / dist;
        p.vx += (dx / dist) * force;
        p.vy += (dy / dist) * force;
      });
      p.vx *= 0.96;
      p.vy *= 0.96;
      p.x += p.vx;
      p.y += p.vy;

      if (p.x < 0) p.x = window.innerWidth;
      if (p.x > window.innerWidth) p.x = 0;
      if (p.y < 0) p.y = window.innerHeight;
      if (p.y > window.innerHeight) p.y = 0;
    });

    bursts.forEach((b) => (b.life += 0.03));
    bursts = bursts.filter((b) => b.life < 1);
  }

  function draw() {
    ctx.fillStyle = 'rgba(5,6,15,0.25)';
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    particles.forEach((p) => {
      ctx.beginPath();
      ctx.fillStyle = p.color;
      ctx.globalAlpha = 0.85;
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
